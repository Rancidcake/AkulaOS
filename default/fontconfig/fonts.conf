<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Font family priority ──────────────────────────────────────────────────
       Inter has full Latin+Cyrillic coverage; PT Sans/Mono sit next so that
       Cyrillic characters not yet in Inter render in the intended typeface
       rather than falling through to a random system font.
       Noto is the Unicode catch-all for everything else.          ────────── -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>PT Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>PT Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- No serif in the design system; Noto handles fallback gracefully. -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- Rendering ─────────────────────────────────────────────────────────────
       hintslight + lcddefault is the correct pairing for modern LCD screens.
       embeddedbitmap=false prevents older fonts from using their built-in
       pixel-hinted bitmaps, which look wrong at non-integer scales.  ─────── -->

  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"           mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>
