# AkulaOS GTK3 settings
# Mirrors the gsettings applied in default/sway/config so apps outside
# Sway (e.g. run from a script) also get the right appearance.

[Settings]
gtk-font-name=Inter 10
gtk-theme-name=Adwaita
gtk-icon-theme-name=Yaru
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

# No button images or menu icons — matches the "no decoration without purpose" rule
gtk-button-images=0
gtk-menu-images=0

# No system sounds
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0

# Font rendering — must match fontconfig/fonts.conf
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

# Minimal client-side decorations: close button only, right side
gtk-decoration-layout=:close
