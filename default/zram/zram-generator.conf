# AkulaOS zram configuration — OQ-001 (conservative pick).
# 50% of RAM as compressed swap using zstd.
#
# On a 4 GB machine: ~2 GB virtual swap at roughly 3:1 compression,
# using ~700 MB real RAM overhead in the worst case. Keeps the OOM
# killer away when Firefox is open alongside other apps.
#
# zram-generator activates zram0 automatically via systemd on boot
# when this file is present — no explicit service enable needed.

[zram0]
zram-size             = ram / 2
compression-algorithm = zstd
