# AkulaOS — foot terminal config

[main]
font=JetBrains Mono:size=11
pad=8x8
dpi-aware=no

[cursor]
style=block
blink=no
color=e8e2d0 1a1a1a

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}

[colors]
foreground=e8e2d0
background=1a1a1a

# 8 standard terminal colors mapped to the AkulaOS palette.
# No green, yellow, blue, or magenta in the palette — cyan and rust fill those roles.
regular0=1a1a1a  # black    → ink
regular1=c41e1e  # red      → red
regular2=2a6f7f  # green    → cyan
regular3=8b2914  # yellow   → rust
regular4=2a6f7f  # blue     → cyan
regular5=8b2914  # magenta  → rust
regular6=2a6f7f  # cyan     → cyan
regular7=e8e2d0  # white    → paper

bright0=4a4a4a   # br.black   → rule
bright1=c41e1e   # br.red     → red
bright2=2a6f7f   # br.green   → cyan
bright3=8a8a82   # br.yellow  → mute
bright4=2a6f7f   # br.blue    → cyan
bright5=8b2914   # br.magenta → rust
bright6=2a6f7f   # br.cyan    → cyan
bright7=e8e2d0   # br.white   → paper
