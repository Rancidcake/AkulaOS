insmod part_gpt
insmod part_msdos

search --no-floppy --set=root --label "AKULA_OS"

set timeout=5
set default=0

menuentry "AkulaOS Installer (x86_64)" {
    linux  /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=AKULA_OS
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "AkulaOS Installer — copy to RAM" {
    linux  /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=AKULA_OS copytoram
    initrd /arch/boot/x86_64/initramfs-linux.img
}
