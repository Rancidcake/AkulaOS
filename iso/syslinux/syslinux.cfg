DEFAULT akula
TIMEOUT 50
PROMPT 0

LABEL akula
  MENU LABEL AkulaOS Installer (x86_64)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  APPEND archisobasedir=arch archisolabel=AKULA_OS
  INITRD /arch/boot/x86_64/initramfs-linux.img

LABEL akula-copytoram
  MENU LABEL AkulaOS Installer — copy to RAM
  LINUX /arch/boot/x86_64/vmlinuz-linux
  APPEND archisobasedir=arch archisolabel=AKULA_OS copytoram
  INITRD /arch/boot/x86_64/initramfs-linux.img
